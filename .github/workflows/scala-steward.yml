on:
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * MON"

name: Scala Steward
permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  scala-steward:
    runs-on: ubuntu-22.04
    name: Scala Steward
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/552057127791/locations/global/workloadIdentityPools/github/providers/github
          service_account: container-builder@helical-crowbar-220917.iam.gserviceaccount.com

      - name: Scala Steward
        uses: scala-steward-org/scala-steward-action@v2
        with:
          author-email: jenkins@garnercorp.com
          author-name: GarnerUser
          scala-steward-version: 0.30.2
